<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Відновлення пароля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #5b2f94, #3e1f58);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-box {
            background-color: #15151e;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 8px;
            padding-left: 40px;
        }
        .form-group svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            fill: #888;
            width: 20px;
            height: 20px;
        }
        .btn-purple {
            background-color: #805ad5;
            border: none;
        }
        .btn-purple:hover {
            background-color: #6b46c1;
        }
        .btn-secondary {
            background-color: #2c2c3c;
            border: none;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Відновлення пароля</h2>
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <svg viewBox="0 0 24 24">
                    <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.89 2 1.99 2H20c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
                </svg>
                {{ form.email.errors }}
                {{ form.email }}
            </div>

            <button type="submit" class="btn btn-purple btn-lg w-100 mb-2">Надіслати посилання</button>
            <a href="{% url 'school_info' %}" class="btn btn-secondary btn-lg w-100">На головну</a>
        </form>
    </div>
</body>
</html>
