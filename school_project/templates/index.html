<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Інформація про школу</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #0d0c1d, #3e1f58);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 15px;
      overflow: hidden;
      position: relative;
    }

    /* Зоряне небо */
    .stars, .stars::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: transparent url('https://www.transparenttextures.com/patterns/stardust.png') repeat;
      animation: moveStars 60s linear infinite;
      opacity: 0.15;
      z-index: 0;
    }

    @keyframes moveStars {
      from { transform: translate(0, 0); }
      to { transform: translate(-500px, -500px); }
    }

    .info-box {
      background-color: #15151e;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .info-box h2 {
      font-size: 2rem;
      font-weight: bold;
      text-align: center;
      margin-bottom: 10px;
    }

    .info-box h3 {
      font-size: 1.3rem;
      text-align: center;
      margin-bottom: 25px;
      position: relative;
    }

    .info-box h3::after {
      content: "";
      display: block;
      width: 60px;
      height: 2px;
      background-color: #805ad5;
      margin: 10px auto 0;
      border-radius: 1px;
    }

    .list-group-item {
      background-color: transparent;
      border: none;
      padding: 10px 0;
    }

    .btn-block {
      width: 100%;
      border-radius: 12px;
      font-size: 1rem;
      padding: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease-in-out;
      cursor: pointer;
    }

    .btn-block:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    .btn-primary {
      background-color: #805ad5;
      border: none;
    }

    .btn-success {
      background-color: #38a169;
      border: none;
    }

    .btn-warning {
      background-color: #f6ad55;
      border: none;
      color: black;
    }

    svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      vertical-align: middle;
    }

    @media (max-width: 400px) {
      .info-box {
        padding: 20px;
      }

      .btn-block {
        font-size: 0.9rem;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="info-box">
    <h2>
      <svg viewBox="0 0 24 24">
        <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
      </svg>
      Класи та студенти
    </h2>

    <h3>
      <svg viewBox="0 0 24 24">
        <path d="M3 6h18v2H3zM3 12h12v2H3zM3 18h6v2H3z"/>
      </svg>
      Посилання
    </h3>

    <ul class="list-group">
      <li class="list-group-item">
        <a href="{% url 'class_list' %}" class="btn btn-primary btn-block">
          <svg viewBox="0 0 24 24">
            <path d="M4 6h16v2H4zm0 5h10v2H4zm0 5h16v2H4z"/>
          </svg>
          Переглянути всі класи
        </a>
      </li>
      <li class="list-group-item">
        <a href="{% url 'student_list' %}" class="btn btn-success btn-block">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
          </svg>
          Переглянути всіх студентів
        </a>
      </li>
      <li class="list-group-item">
        <a href="{% url 'teacher_list' %}" class="btn btn-warning btn-block">
          <svg viewBox="0 0 24 24">
            <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm-2 1h4c4 0 6 2 6 6H4c0-4 2-6 6-6z"/>
          </svg>
          Переглянути всіх вчителів
        </a>
      </li>
    </ul>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
