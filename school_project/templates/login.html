<!-- templates/accounts/login.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Вхід</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #5b2f94, #3e1f58);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background-color: #15151e;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .form-group {
            position: relative;
            margin-bottom: 20px;
        }
        .form-control {
            border-radius: 8px;
            padding-left: 40px;
        }
        .form-group svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            fill: #888;
            width: 20px;
            height: 20px;
        }
        .btn-purple {
            background-color: #805ad5;
            border: none;
        }
        .btn-purple:hover {
            background-color: #6b46c1;
        }
        .btn-secondary {
            background-color: #2c2c3c;
            border: none;
        }
        .btn-secondary-sm {
            font-size: 0.8rem; /* Менший розмір */
            padding: 5px 10px; /* Менші відступи */
            width: auto;
            display: inline-block;
        }
        .btn-left {
            text-align: left;
            width: auto;
            margin-left: 0;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Вхід</h2>
        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <svg viewBox="0 0 24 24">
                    <path d="M12 12c2.7 0 5-2.3 5-5s-2.3-5-5-5-5 2.3-5 5 2.3 5 5 5zm0 2c-3.3 0-10 1.7-10 5v3h20v-3c0-3.3-6.7-5-10-5z"/>
                </svg>
                <input type="text" name="username" class="form-control" placeholder="Ім’я користувача" required>
            </div>

            <div class="form-group">
                <svg viewBox="0 0 24 24">
                    <path d="M17 8h-1V6c0-2.8-2.2-5-5-5S6 3.2 6 6v2H5c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM8 6c0-1.7 1.3-3 3-3s3 1.3 3 3v2H8V6z"/>
                </svg>
                <input type="password" name="password" class="form-control" placeholder="Пароль" required>
            </div>

            {% if error %}
                <p class="text-danger text-center">{{ error }}</p>
            {% endif %}

            <button type="submit" class="btn btn-purple btn-lg w-100 mb-2">Увійти</button>
            <a href="{% url 'register' %}" class="btn btn-secondary btn-lg w-100">Зареєструватися</a>
            <a href="{% url 'password_reset' %}" class="btn btn-secondary btn-secondary-sm btn-left mt-3">Відновити Пароль</a>

        </form>
    </div>
</body>
</html>
