<h1>Розклад занять</h1>
<a href="{% url 'add_schedule' %}">Додати заняття</a>
<ul>
    {% for schedule in schedules %}
        <li>
            {{ schedule.class_group.name }} - {{ schedule.subject.name }} - {{ schedule.day_of_week }} - {{ schedule.time }}
            <a href="{% url 'edit_schedule' schedule.id %}">Редагувати</a> |
            <a href="{% url 'delete_schedule' schedule.id %}">Видалити</a>
        </li>
    {% endfor %}
</ul>
