<!-- templates/reset_password.html -->
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Новий пароль</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #5b2f94, #3e1f58);
            color: white;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-box {
            background-color: #15151e;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
        }
        .register-box h2 {
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-purple {
            background-color: #805ad5;
            border: none;
        }
        .btn-purple:hover {
            background-color: #6b46c1;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h2>Встановити новий пароль</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="mb-3">
                {{ form.new_password1.label_tag }}
                {{ form.new_password1 }}
                {{ form.new_password1.errors }}
            </div>
            <div class="mb-3">
                {{ form.new_password2.label_tag }}
                {{ form.new_password2 }}
                {{ form.new_password2.errors }}
            </div>
            <button type="submit" class="btn btn-purple btn-lg w-100">Змінити пароль</button>
        </form>
    </div>
</body>
</html>
