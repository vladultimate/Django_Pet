<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Класи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin-top: 50px;
        }
        .btn {
            font-size: 1rem;
            padding: 10px 20px;
        }
        .form-control {
            font-size: 1rem;
        }
        .list-group-item {
            font-size: 1.1rem;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .btn-sm {
            font-size: 0.9rem;
            padding: 5px 10px;
        }
        .btn-danger {
            font-size: 1rem;
            padding: 5px 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .alert-warning {
            font-size: 1.2rem;
        }
    </style>
</head>
<body class="bg-white text-dark">
    <div class="container py-4">
        <h1>📚 Список класів</h1>

        {% if classes %}
            <ul class="list-group mb-4">
                {% for class in classes %}
                    <li class="list-group-item">
                        <span>Клас: {{ class.name }}</span>
                        <form method="POST" action="{% url 'delete_class' class.id %}" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" name="delete" class="btn btn-danger btn-sm" onclick="return confirm('Видалити клас?');">❌</button>
                        </form>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <div class="alert alert-warning">Ще не додано жодного класу.</div>
        {% endif %}

        <h2 class="mt-4">Додати новий клас</h2>
        <form method="POST" action="{% url 'add_class' %}" class="mt-3">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn btn-success">Додати Клас</button>
        </form>

        <br>
        <a href="{% url 'school_info' %}" class="btn btn-secondary mt-3">🔙 Повернутися</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.4/dist/js/bootstrap.min.js"></script>
</body>
</html>
